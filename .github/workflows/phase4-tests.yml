# Phase 4 real-backbone integration tests for four-scene-brain.
#
# Four jobs:
#   1. mock-regression    — every push/PR; full mock test suite, no secrets, no GPU.
#   2. zero-diff-check    — every push/PR; guards the frozen common/ contract.
#   3. game-real-mariogpt — push to main + manual dispatch; CPU runner, installs
#                           mario-gpt, runs tests/test_game_real.py with
#                           FOURSCENE_REAL_TESTS=1. No secret needed (MarioGPT
#                           is a local distilgpt2 model, MIT license).
#   4. video-3d-real-fal  — manual dispatch only; PLACEHOLDER. Requires FAL_KEY
#                           secret. Real implementation pending:
#                           branches/video/backbone_hunyuan.py +
#                           branches/3d/backbone_trellis.py +
#                           tests/test_video_real.py + tests/test_3d_real.py.
#
# Security red lines (per docs/phase4-integration-framework.md §4.4):
#   - PR workflows from forks do NOT inherit secrets -> real-API tests only run
#     on `push` to main or `workflow_dispatch`, never on `pull_request`.
#   - MarioGPT needs no credentials (local model), so it CAN run on push to main.
#   - FAL_KEY (for video/3d) is only readable from the secret store on main
#     branch runs, never on PR runs.
#
# Pricing (verified 2026-07-27):
#   - Public repo + ubuntu-latest standard runner = FREE, unlimited minutes.
#   - This workflow uses ONLY standard CPU runners (no GPU) -> $0 cost.
#   - MarioGPT (distilgpt2 ~82M) runs on CPU in ~30-90s per generate().

name: Phase 4 Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    # manual trigger from the Actions tab; can run any job on any branch

# cancel in-progress runs of the same PR/branch when a new push lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: mock regression — every push/PR. The project's baseline.
  # ---------------------------------------------------------------------------
  mock-regression:
    name: Mock regression (no deps, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test deps (repo runs via pythonpath=["."]; no package install)
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run full mock test suite
        env:
          # explicitly ensure real tests are OFF for this job
          FOURSCENE_REAL_TESTS: ""
        run: python -m pytest tests/ -v --tb=short

      - name: Run all branch self-tests
        run: |
          python -m branches.game.adapter
          python -m branches.game.backbone_mock
          python -m branches.game.backbone_mariogpt
          python -m branches.video.adapter
          python -c "import runpy; runpy.run_module('branches.3d.adapter', run_name='__main__')"
          python -m branches.robot.adapter 2>/dev/null || echo "(robot adapter self-test skipped)"

  # ---------------------------------------------------------------------------
  # Job 2: zero-diff check — every push/PR. Guards the frozen common/ contract.
  # ---------------------------------------------------------------------------
  zero-diff-check:
    name: Zero-diff guard (common/ frozen)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run zero-diff contract test
        run: python -m pytest tests/test_zero_diff.py tests/test_contract.py -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 3: game-A real (MarioGPT) — push to main + manual dispatch.
  # No secret needed (distilgpt2 is a public HuggingFace model). CPU-only.
  # ---------------------------------------------------------------------------
  game-real-mariogpt:
    name: Game-A real (MarioGPT, CPU)
    # only on main push or manual dispatch — NOT on PR (so PRs from forks
    # don't need to download ~500MB of torch/transformers)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # mario-gpt last released 2023-08; use 3.11 for best wheel compat
          # with its pinned transformers/torch versions
          python-version: "3.11"
          cache: pip

      - name: Install test deps + mario-gpt
        run: |
          python -m pip install --upgrade pip
          # mario-gpt==0.1.3 imports AutoModelWithLMHead, which was removed in
          # transformers>=4.56. Pin both in one resolver invocation so pip can
          # find a mutually compatible wheel set (~500MB download: torch + transformers + Pillow).
          pip install pytest "mario-gpt==0.1.3" "transformers==4.30.2"

      - name: Verify MarioGPT dependency compatibility
        run: |
          python - <<'PY'
          import transformers
          from transformers import AutoModelWithLMHead
          from mario_gpt import MarioLM
          print("transformers:", transformers.__version__)
          print("MarioGPT import: OK")
          PY

      - name: Cache HuggingFace model (distilgpt2 ~82M)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-distilgpt2-${{ runner.os }}-v1
          restore-keys: |
            hf-distilgpt2-${{ runner.os }}-

      - name: Run real MarioGPT tests
        env:
          FOURSCENE_REAL_TESTS: "1"
        run: python -m pytest tests/test_game_real.py -v --tb=long

  # ---------------------------------------------------------------------------
  # Job 4: video/3d real via fal.ai — PLACEHOLDER (manual dispatch only).
  # Requires FAL_KEY secret. Real implementation pending:
  #   - branches/video/backbone_hunyuan.py (HunyuanVideo 1.5 via fal.ai)
  #   - branches/3d/backbone_trellis.py (TRELLIS.2 via fal.ai)
  #   - tests/test_video_real.py
  #   - tests/test_3d_real.py
  # Uncomment the pytest step once those files land.
  # ---------------------------------------------------------------------------
  video-3d-real-fal:
    name: Video/3D real via fal.ai (placeholder)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check FAL_KEY secret presence
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          if [ -z "$FAL_KEY" ]; then
            echo "::warning::FAL_KEY secret not set; video/3d real tests cannot run."
            echo "::warning::Add FAL_KEY in repo Settings > Secrets and Variables > Actions."
            exit 0
          fi
          echo "FAL_KEY is set; proceeding (but real tests not implemented yet)."

      - name: Placeholder — real video/3d tests pending
        run: |
          echo "::notice::Phase 4 video/3d real integration is a placeholder."
          echo "::notice::Pending files:"
          echo "::notice::  branches/video/backbone_hunyuan.py (HunyuanVideo 1.5 via fal.ai)"
          echo "::notice::  branches/3d/backbone_trellis.py (TRELLIS.2 via fal.ai)"
          echo "::notice::  tests/test_video_real.py"
          echo "::notice::  tests/test_3d_real.py"
          echo "::notice::Once those land, replace this step with:"
          echo "::notice::  env: FOURSCENE_REAL_TESTS=1 FAL_KEY=\${{ secrets.FAL_KEY }}"
          echo "::notice::  run: python -m pytest tests/test_video_real.py tests/test_3d_real.py -v"
